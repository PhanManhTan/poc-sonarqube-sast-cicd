sonar.projectKey=poc-sast-flask-backend
sonar.projectName=PoC SAST Flask Backend
sonar.sourceEncoding=UTF-8

sonar.sources=app,run.py,sast-fixtures
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,.venv/**,artifacts/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=run.py,sast-fixtures/**
sonar.cpd.exclusions=sast-fixtures/**
