# SonarQube Cloud configuration
sonar.projectKey=PhanManhTan_poc-sonarqube-sast-cicd
sonar.organization=phanmanhtan
sonar.projectName=PoC SonarQube SAST CICD
sonar.sourceEncoding=UTF-8
sonar.sources=app,run.py,sast-fixtures
sonar.tests=tests
