name: Backend CI and SonarQube Cloud SAST

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'sast-fixtures/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'sonar-project.properties'
      - '.github/workflows/backend-sast.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/**'
      - 'tests/**'
      - 'sast-fixtures/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'sonar-project.properties'
      - '.github/workflows/backend-sast.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backend tests and create coverage report
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage for the SAST job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sast:
    name: SonarQube Cloud SAST Scan
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      security-events: write
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download test coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION || 'phanmanhtan' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'PhanManhTan_poc-sonarqube-sast-cicd' }}
            -Dsonar.qualitygate.wait=true
