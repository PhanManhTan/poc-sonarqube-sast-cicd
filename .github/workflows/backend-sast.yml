name: Backend CI and SonarQube Cloud SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backend tests and create coverage report
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage for the SAST job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sast:
    name: SonarQube Cloud SAST
    needs: test
    # GitHub does not pass repository secrets to workflows from forked pull requests.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download test coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::Missing SONAR_TOKEN secret. Add the SonarCloud analysis token in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "::error::Missing SONAR_ORGANIZATION variable. Add the SonarCloud organization key in GitHub Actions variables."
            exit 1
          fi
          if [ -z "${SONAR_PROJECT_KEY}" ]; then
            echo "::error::Missing SONAR_PROJECT_KEY variable. Add the SonarCloud project key in GitHub Actions variables."
            exit 1
          fi

      - name: Submit analysis and wait for the Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
