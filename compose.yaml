name: poc-sast-sonarqube

services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    restart: unless-stopped
    ports:
      - "${SONAR_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data

volumes:
  sonarqube_data:
